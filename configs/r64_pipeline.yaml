# Canonical Range-GDC protocol. Experiment variants use CLI overrides.
output_root: /data/kitti/pseudo_lidar_range_gdc
kitti_root: /data/kitti/kitti_object/training
split_file: ./split/val.txt
threads: 4
data_tag: canonical
sdn_config: ./src/configs/sdn_kitti_train.config
sdn_checkpoint: /data/kitti/pseudo_lidar/sdn_kitti_train_set/checkpoint.pth.tar

anchor:
  mode: shared_canonical
  selected_rows: [5, 7, 9, 11]
  threads: 4
range_anchor:
  mode: shared_canonical
  selected_rows: [5, 7, 9, 11]
  threads: 4
anchor_filter:
  mode: abs
  abs_error_thr: 2.0
  log_ratio_thr: 0.4
  force_policy: accepted_only
range_gdc:
  method: cg
  range_min: 0.1
  range_max: 80.0
  lambda_anchor: 300.0
  lambda_prior: 0.1
  lambda_smooth: 1.0
  neighbor: angular_grid8
  edge_spatial_mode: angular
  sigma_angular: 0.01
  sigma_log_range: 0.3
  delta_clip: 0.3
  projection:
    height: 64
    width: 1024
    vmin_deg: -24.9
    vmax_deg: 2.0
    azimuth_mode: full_360_front_centered
    invalid_value: 0.0
    image_fov_only: true
original_gdc:
  run_naive: true
  run_optimized: true
evaluation:
  include_raw: true
  include_original_gdc: true
  include_range_gdc: true
  enable_leakage_check: true
  source_rows: 4
