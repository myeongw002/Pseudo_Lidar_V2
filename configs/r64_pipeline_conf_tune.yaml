# Confidence calibration experiment.
# Based on the original paper configuration.
# Graph-related parameters are frozen.
# Only confidence parameters are changed across experiments.

output_root: /data/kitti/pseudo_lidar_conf_tune
pipeline: both

kitti_root: /data/kitti/kitti_object/training
split_file: ./split/train.txt
threads: 4

sdn_config: ./src/configs/sdn_kitti_train.config
sdn_checkpoint: /data/kitti/pseudo_lidar/sdn_kitti_train_set/checkpoint.pth.tar

data_tag: confidence_tune
sdn_workers: 4
bval: 1


# ---------------------------------------------------------
# Sparse LiDAR anchor
# ---------------------------------------------------------

anchor:
  mode: shared_pointcloud
  source_ptc_path: /data/kitti/kitti_object/training/velodyne
  selected_lines: [5, 7, 9, 11]
  extraction_height: 64
  extraction_width: 1024
  image_fov_only: true
  threads: 4


range_anchor:
  mode: gt_rows
  selected_rows: [5, 7, 9, 11]
  threads: 4


# ---------------------------------------------------------
# Anchor filtering
# ---------------------------------------------------------

anchor_filter:
  mode: abs
  abs_error_thr: 2.0
  log_ratio_thr: 0.4
  force_policy: accepted_only


# ---------------------------------------------------------
# Original GDC
# ---------------------------------------------------------

original_gdc:
  run_naive: true
  run_optimized: true
  k: 10
  recon_tol: 0.0005
  method: cg
  consider_range: [-0.1, 3.0]
  subsample_strategy: deterministic
  subsample_seed: 0
  subsample_output: preserve
  threads: 4


# ---------------------------------------------------------
# Range GDC
# ---------------------------------------------------------

range_gdc:
  output_mode: range_eval

  projection:
    height: 64
    width: 1024
    azimuth_mode: full_360_front_centered
    vmin_deg: -24.9
    vmax_deg: 2.0
    image_fov_only: true
    threads: 4

  method: cg

  range_min: 0.1
  range_max: 80.0

  # ---------- Graph: FROZEN ----------
  lambda_anchor: 300.0
  lambda_prior: 0.1
  lambda_smooth: 1.0

  neighbor: angular_grid8
  edge_spatial_mode: angular

  sigma_angular: 0.01
  sigma_log_range: 0.3

  # ---------- Direct residual: FROZEN ----------
  transfer_k: 3
  transfer_neighbor_mode: rowcol
  direct_weight_mode: weighted_knn
  confidence_mode: nearest

  # ---------- Confidence: TUNING TARGET ----------
  sigma_conf_pixel: 2.0
  sigma_conf_log_range: 0.05
  confidence_power: 2.0

  # Original paper selection rule
  selection_mode: soft
  confidence_high_thr: 0.8
  confidence_low_thr: 0.2

  delta_clip: 0.3
  anchor_force_policy: accepted_only

  threads: 4


# ---------------------------------------------------------
# Evaluation
# ---------------------------------------------------------

evaluation:
  enabled: true
  include_raw: true
  include_image_gdc: true
  include_range_gdc: true

  enable_leakage_check: true
  allow_leakage: false

  source_rows: 4

  range_min: 0.1
  range_max: 80.0


timing:
  enabled: true